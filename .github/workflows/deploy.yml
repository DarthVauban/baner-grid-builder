name: Deploy

on:
  push:
    branches: [main, dev]
  workflow_dispatch:

concurrency:
  group: mt-panel-${{ github.ref_name }}
  cancel-in-progress: false

jobs:
  quality:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npm run verify
      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e

  build-and-push:
    needs: quality
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - uses: actions/checkout@v7

      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - id: meta
        uses: docker/metadata-action@v6
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=sha,prefix=sha-,format=long

      - uses: docker/build-push-action@v7
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            APP_BUILD_SHA=${{ github.sha }}

  deploy:
    needs: build-and-push
    runs-on: ubuntu-latest
    environment: ${{ github.ref_name == 'main' && 'production' || 'development' }}
    permissions:
      contents: read
      packages: read
    env:
      APP_DIR: ${{ github.ref_name == 'main' && '/opt/mt-workspace/prod' || '/opt/mt-workspace/dev' }}
      APP_PORT: ${{ github.ref_name == 'main' && '3100' || '3101' }}
      COMPOSE_PROJECT: ${{ github.ref_name == 'main' && 'mt-panel-prod' || 'mt-panel-dev' }}
      APP_ENVIRONMENT: ${{ github.ref_name == 'main' && 'production' || 'development' }}

    steps:
      - uses: actions/checkout@v7

      - name: Sync deployment configuration
        uses: appleboy/scp-action@v1
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          # Keep both deploy-owned files directly in APP_DIR. Older servers may
          # contain a root-owned docker/telegram-bot-api directory created by
          # Docker, which the unprivileged deployment account cannot overwrite.
          source: docker-compose.yml,telegram-bot-api-runtime-entrypoint.sh
          target: ${{ env.APP_DIR }}
          overwrite: true

      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          command_timeout: 20m
          script: |
            set -euo pipefail
            APP_DIR='${{ env.APP_DIR }}'
            APP_PORT='${{ env.APP_PORT }}'
            COMPOSE_PROJECT='${{ env.COMPOSE_PROJECT }}'
            APP_ENVIRONMENT='${{ env.APP_ENVIRONMENT }}'
            cd "$APP_DIR"
            test "$(pwd -P)" = "$APP_DIR"
            test -f .env

            export XDG_RUNTIME_DIR="/run/user/$(id -u)"
            export DOCKER_HOST="unix://$XDG_RUNTIME_DIR/docker.sock"
            test -S "$XDG_RUNTIME_DIR/docker.sock"

            REPOSITORY="$(echo 'ghcr.io/${{ github.repository }}' | tr '[:upper:]' '[:lower:]')"
            IMAGE="$REPOSITORY:sha-${{ github.sha }}"
            export APP_IMAGE="$IMAGE"
            export APP_BIND_PORT="$APP_PORT"
            export COMPOSE_PROJECT_NAME="$COMPOSE_PROJECT"
            export APP_ENVIRONMENT

            echo "Deploying $IMAGE to $COMPOSE_PROJECT on 127.0.0.1:$APP_PORT"
            df -h / "$APP_DIR" || true
            docker system df || true

            retry() {
              max_attempts="$1"
              delay_seconds="$2"
              shift 2
              attempt=1
              until "$@"; do
                if [ "$attempt" -ge "$max_attempts" ]; then
                  echo "Registry command failed after $attempt attempts." >&2
                  return 1
                fi
                echo "Registry command failed (attempt $attempt/$max_attempts). Retrying in ${delay_seconds}s..." >&2
                sleep "$delay_seconds"
                attempt=$((attempt + 1))
                delay_seconds=$((delay_seconds * 2))
              done
            }

            login_ghcr() {
              printf '%s\n' '${{ github.token }}' | docker login ghcr.io -u '${{ github.actor }}' --password-stdin
            }

            retry 4 5 login_ghcr
            retry 5 10 docker pull "$IMAGE"
            EXPECTED_IMAGE_ID="$(docker image inspect "$IMAGE" --format '{{.Id}}')"
            docker compose config --quiet
            TELEGRAM_LOCAL_ENABLED="$(sed -n 's/^TELEGRAM_LOCAL_MODE=//p' .env | tail -n 1 | tr -d '\r"' | tr '[:upper:]' '[:lower:]')"
            if [ "$TELEGRAM_LOCAL_ENABLED" = "true" ]; then
              if [ -f .telegram-bot-api.env ]; then
                test "$(stat -c '%a' .telegram-bot-api.env)" = "600"
                grep -Eq '^TELEGRAM_API_ID=[0-9]+$' .telegram-bot-api.env
                grep -Eq '^TELEGRAM_API_HASH=[a-fA-F0-9]{32}$' .telegram-bot-api.env
              fi
              docker compose --profile telegram-local config --quiet
              retry 5 10 docker compose --profile telegram-local pull telegram-bot-api
            fi
            MEDIA_BACKUP="$(mktemp -d)"
            deployment_cleanup() {
              status="$1"
              trap - EXIT
              if [ "$status" -ne 0 ]; then
                echo "Deployment failed. Container diagnostics:" >&2
                docker compose ps >&2 || true
                docker compose --profile telegram-local logs --no-color --tail=120 db app telegram-bot-api >&2 || true
              fi
              rm -rf "$MEDIA_BACKUP"
              exit "$status"
            }
            trap 'deployment_cleanup $?' EXIT

            MIGRATE_LEGACY_MEDIA=false
            OLD_CONTAINER_ID="$(docker compose ps -q app || true)"
            if [ -n "$OLD_CONTAINER_ID" ]; then
              HAS_MEDIA_VOLUME="$(docker inspect "$OLD_CONTAINER_ID" --format '{{range .Mounts}}{{if eq .Destination "/app/storage/catalog-media"}}yes{{end}}{{end}}')"
              if [ "$HAS_MEDIA_VOLUME" != "yes" ]; then
                if docker exec "$OLD_CONTAINER_ID" test -d /tmp/mt-panel-catalog-media; then
                  docker cp "$OLD_CONTAINER_ID:/tmp/mt-panel-catalog-media/." "$MEDIA_BACKUP/"
                  MIGRATE_LEGACY_MEDIA=true
                elif docker exec "$OLD_CONTAINER_ID" test -d /app/storage/catalog-media; then
                  docker cp "$OLD_CONTAINER_ID:/app/storage/catalog-media/." "$MEDIA_BACKUP/"
                  MIGRATE_LEGACY_MEDIA=true
                fi
              fi
            fi

            wait_for_database() {
              DB_CONTAINER_ID="$(docker compose ps -q db)"
              test -n "$DB_CONTAINER_ID" || return 1
              DB_HEALTH="starting"
              for attempt in $(seq 1 12); do
                DB_HEALTH="$(docker inspect "$DB_CONTAINER_ID" --format '{{if .State.Health}}{{.State.Health.Status}}{{else}}{{.State.Status}}{{end}}')"
                if [ "$DB_HEALTH" = "healthy" ]; then
                  return 0
                fi
                echo "PostgreSQL is $DB_HEALTH (attempt $attempt/12)." >&2
                sleep 5
              done
              return 1
            }

            docker compose up -d --no-build db
            if ! wait_for_database; then
              echo "PostgreSQL did not become healthy. Restarting it once." >&2
              docker compose restart db
              wait_for_database
            fi
            docker compose up -d --no-build --force-recreate app
            docker compose ps app
            sleep 8

            CONTAINER_ID="$(docker compose ps -q app)"
            test -n "$CONTAINER_ID"
            MEDIA_MOUNT_TYPE="$(docker inspect "$CONTAINER_ID" --format '{{range .Mounts}}{{if eq .Destination "/app/storage/catalog-media"}}{{.Type}}{{end}}{{end}}')"
            test "$MEDIA_MOUNT_TYPE" = "volume"
            docker exec "$CONTAINER_ID" test -w /app/storage/catalog-media
            BACKUP_TRANSFER_MOUNT_TYPE="$(docker inspect "$CONTAINER_ID" --format '{{range .Mounts}}{{if eq .Destination "/app/storage/telegram-backup-transfer"}}{{.Type}}{{end}}{{end}}')"
            test "$BACKUP_TRANSFER_MOUNT_TYPE" = "volume"
            docker exec "$CONTAINER_ID" test -w /app/storage/telegram-backup-transfer
            TELEGRAM_CONFIG_MOUNT_TYPE="$(docker inspect "$CONTAINER_ID" --format '{{range .Mounts}}{{if eq .Destination "/app/storage/telegram-bot-api-config"}}{{.Type}}{{end}}{{end}}')"
            test "$TELEGRAM_CONFIG_MOUNT_TYPE" = "volume"
            docker exec "$CONTAINER_ID" test -w /app/storage/telegram-bot-api-config
            if [ "$TELEGRAM_LOCAL_ENABLED" = "true" ]; then
              docker compose --profile telegram-local up -d --no-build telegram-bot-api
              TELEGRAM_CONTAINER_ID="$(docker compose --profile telegram-local ps -q telegram-bot-api)"
              test -n "$TELEGRAM_CONTAINER_ID"
              if docker exec "$CONTAINER_ID" test -s /app/storage/telegram-bot-api-config/credentials.env \
                || [ -f .telegram-bot-api.env ]; then
                for attempt in $(seq 1 30); do
                  TELEGRAM_HEALTH="$(docker inspect "$TELEGRAM_CONTAINER_ID" --format '{{if .State.Health}}{{.State.Health.Status}}{{else}}{{.State.Status}}{{end}}')"
                  [ "$TELEGRAM_HEALTH" = "healthy" ] && break
                  [ "$attempt" -lt 30 ] || { echo "Telegram Bot API did not become healthy." >&2; exit 1; }
                  sleep 5
                done
              else
                echo "Telegram Bot API is waiting for API_ID and API_HASH from the Integrations page."
              fi
            fi
            if [ "$MIGRATE_LEGACY_MEDIA" = "true" ]; then
              docker cp "$MEDIA_BACKUP/." "$CONTAINER_ID:/app/storage/catalog-media/"
              docker exec -u root "$CONTAINER_ID" chown -R nodeapp:nodeapp /app/storage/catalog-media
            fi

            RUNNING_IMAGE_ID="$(docker inspect "$CONTAINER_ID" --format '{{.Image}}')"
            test "$RUNNING_IMAGE_ID" = "$EXPECTED_IMAGE_ID"
            RUNNING_REVISION="$(docker inspect "$CONTAINER_ID" --format '{{ index .Config.Labels "org.opencontainers.image.revision" }}')"
            test "$RUNNING_REVISION" = "${{ github.sha }}"
            HEALTH="$(curl -fsS "http://127.0.0.1:$APP_PORT/api/health")"
            echo "$HEALTH"
            grep -Fq '"buildSha":"${{ github.sha }}"' <<< "$HEALTH"
            STOREFRONT="$(curl -fsS "http://127.0.0.1:$APP_PORT/storefront")"
            grep -Fq 'id="storefront-root"' <<< "$STOREFRONT"
            grep -Fq '/web-assets/storefront-' <<< "$STOREFRONT"
            LOADER="$(curl -fsS "http://127.0.0.1:$APP_PORT/api/public/application-forms/loader.js")"
            grep -Fq 'MTApplicationForms' <<< "$LOADER"

            USED_IMAGE_IDS="$(docker ps -aq | xargs -r docker inspect --format '{{.Image}}' | sort -u)"
            while read -r image_ref image_id; do
              case "$image_ref" in
                "$REPOSITORY":sha-*) ;;
                *) continue ;;
              esac
              if [ "$image_ref" = "$IMAGE" ] || printf '%s\n' "$USED_IMAGE_IDS" | grep -Fqx "$image_id"; then
                continue
              fi
              docker image rm "$image_ref" || true
            done < <(docker image ls "$REPOSITORY" --format '{{.Repository}}:{{.Tag}} {{.ID}}')
            docker image prune -f --filter "label=org.opencontainers.image.source=https://github.com/${{ github.repository }}" || true
