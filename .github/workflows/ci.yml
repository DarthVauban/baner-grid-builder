name: CI

on:
  pull_request:
    branches: [dev, main]
  push:
    branches: [dev, main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: popup_banners_test
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run check
      - run: npm run test:server
      - name: Create form campaign PostgreSQL database
        env:
          DATABASE_ADMIN_URL: postgresql://postgres:postgres@127.0.0.1:5432/postgres
        run: >-
          node --input-type=module -e "import pg from 'pg'; const client = new pg.Client({ connectionString: process.env.DATABASE_ADMIN_URL }); await client.connect(); await client.query('CREATE DATABASE form_campaigns_test'); await client.end();"
      - name: Verify form campaign activation on PostgreSQL
        run: node --import ./tests/test-env.js --test tests/form-campaigns.integration.test.js
        env:
          FORM_CAMPAIGN_TEST_DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/form_campaigns_test
      - name: Verify popup banners on PostgreSQL
        run: node --import ./tests/test-env.js --test tests/popup-banners.integration.test.js
        env:
          POPUP_TEST_DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/popup_banners_test
      - run: npm run test:web
      - run: npm run build

  e2e:
    needs: verify
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e
