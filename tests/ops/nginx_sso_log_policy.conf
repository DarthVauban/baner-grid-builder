worker_processes 1;
error_log /fixture/logs/default-error.log info;
pid /tmp/nginx-sso-fixture.pid;

events { worker_connections 64; }

http {
    log_format mt_workspace_prod_safe escape=json
        '{"time":"$time_iso8601","server":"$server_name","method":"$request_method",'
        '"path":"$uri","protocol":"$server_protocol","status":"$status","bytes":"$body_bytes_sent",'
        '"request_seconds":"$request_time","upstream_status":"$upstream_status",'
        '"upstream_seconds":"$upstream_response_time","request_id":"$request_id"}';

    access_log /fixture/logs/default-access.log combined;
    ssl_certificate /fixture/test-cert.pem;
    ssl_certificate_key /fixture/test-key.pem;

    # Deliberately unsafe synthetic negative control. No real credentials are used.
    server {
        listen 8080 default_server;
        listen 8443 ssl default_server;
        server_name default.fixture.invalid;
        root /nonexistent-fixture-root;
    }

    server {
        listen 8080;
        server_name mt-workspace.fixture.invalid;
        access_log /fixture/logs/safe-access.log mt_workspace_prod_safe;
        error_log /dev/null crit;
        return 301 https://mt-workspace.fixture.invalid$request_uri;
    }

    server {
        listen 8443 ssl;
        server_name mt-workspace.fixture.invalid;
        access_log /fixture/logs/safe-access.log mt_workspace_prod_safe;
        error_log /dev/null crit;

        location = /api/health { return 200 '{"status":"fixture_ok"}'; }
        location = /login { return 200 'Synthetic login fixture'; }
        location = /api/integrations/smart-search/authorize {
            return 400 '{"error":"invalid_request"}';
        }
        location = /api/integrations/smart-search/introspect {
            return 401 '{"error":"invalid_client"}';
        }
        location = /upstream-failure {
            proxy_connect_timeout 1s;
            proxy_read_timeout 1s;
            proxy_pass http://127.0.0.1:1;
        }
        location / { return 404; }
    }
}
