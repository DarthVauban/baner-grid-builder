server {
    listen 80;
    listen [::]:80;
    server_name shop.mt-panel.sbs;

    return 301 https://shop.mt-panel.sbs$request_uri;
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name shop.mt-panel.sbs;

    ssl_certificate /opt/mt-workspace/prod/tls/shop-fullchain.pem;
    ssl_certificate_key /opt/mt-workspace/prod/tls/shop-privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    client_max_body_size 100m;

    location ~ ^/(?:$|smartphones/|storefront(?:/smartphones/.*)?$|api/storefront/|api/public/application-forms/|media/catalog/|web-assets/|mt-auto-height-sandbox\.js$) {
        proxy_pass http://127.0.0.1:3100;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_buffering off;
        proxy_read_timeout 120s;
    }

    location / {
        return 404;
    }
}
