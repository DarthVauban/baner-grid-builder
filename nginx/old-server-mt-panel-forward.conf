server {
    listen 80;
    listen [::]:80;
    server_name mt-panel.sbs www.mt-panel.sbs;

    return 301 https://mt-panel.sbs$request_uri;
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name mt-panel.sbs www.mt-panel.sbs;

    ssl_certificate /etc/letsencrypt/live/mt-panel.sbs/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/mt-panel.sbs/privkey.pem;
    include /etc/nginx/fastpanel2-includes/letsencrypt.conf;

    client_max_body_size 100m;

    location / {
        proxy_pass https://45.88.191.194;
        proxy_http_version 1.1;
        proxy_ssl_server_name on;
        proxy_ssl_name mt-panel.sbs;
        proxy_ssl_verify on;
        proxy_ssl_trusted_certificate /etc/ssl/certs/ca-certificates.crt;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_connect_timeout 10s;
        proxy_send_timeout 900s;
        proxy_read_timeout 900s;
    }
}
