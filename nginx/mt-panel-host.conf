server {
    listen 80;
    listen [::]:80;
    server_name mt-panel.sbs www.mt-panel.sbs;

    return 301 https://mt-panel.sbs$request_uri;
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name mt-panel.sbs www.mt-panel.sbs;

    ssl_certificate /opt/mt-workspace/prod/tls/fullchain.pem;
    ssl_certificate_key /opt/mt-workspace/prod/tls/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    client_max_body_size 100m;

    if ($host = www.mt-panel.sbs) {
        return 301 https://mt-panel.sbs$request_uri;
    }

    location /api/admin/backups/ {
        client_max_body_size 520m;

        proxy_pass http://127.0.0.1:3100;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";

        client_body_timeout 900s;
        proxy_connect_timeout 10s;
        proxy_send_timeout 900s;
        proxy_read_timeout 900s;
        send_timeout 900s;
    }

    location / {
        proxy_pass http://127.0.0.1:3100;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";

        proxy_connect_timeout 10s;
        proxy_send_timeout 120s;
        proxy_read_timeout 120s;
    }
}
