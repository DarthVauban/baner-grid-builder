services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-banner_builder}
      POSTGRES_USER: ${POSTGRES_USER:-banner_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
    volumes:
      - banner_db_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-banner_user} -d ${POSTGRES_DB:-banner_builder}"]
      interval: 5s
      timeout: 5s
      retries: 12

  app:
    image: ${APP_IMAGE:-ghcr.io/darthvauban/baner-grid-builder:latest}
    build: .
    restart: unless-stopped
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    env_file:
      - .env
    environment:
      NODE_ENV: production
      APP_ENVIRONMENT: ${APP_ENVIRONMENT:-production}
      PORT: 3000
      DATABASE_URL: postgresql://${POSTGRES_USER:-banner_user}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB:-banner_builder}
      DATABASE_SSL: "false"
      CATALOG_MEDIA_DIR: /app/storage/catalog-media
      TELEGRAM_LOCAL_MODE: ${TELEGRAM_LOCAL_MODE:-false}
      TELEGRAM_API_BASE_URL: ${TELEGRAM_API_BASE_URL:-}
      TELEGRAM_BACKUP_TEMP_DIR: /app/storage/telegram-backup-transfer
      TELEGRAM_LOCAL_FILE_URI_DIR: /var/lib/telegram-bot-api/backup-upload
      TELEGRAM_LOCAL_CREDENTIALS_DIR: /app/storage/telegram-bot-api-config
      SEARCH_FEATURE_ENABLED: ${SEARCH_FEATURE_ENABLED:-false}
      OPENSEARCH_URL: ${OPENSEARCH_URL:-http://opensearch:9200}
      OPENSEARCH_INDEX_PREFIX: ${OPENSEARCH_INDEX_PREFIX:-mt-search}
      REDIS_URL: ${REDIS_URL:-redis://redis:6379}
      SEARCH_WIDGET_ORIGIN: ${SEARCH_WIDGET_ORIGIN:-}
      SEARCH_SYNC_INTERVAL_MINUTES: ${SEARCH_SYNC_INTERVAL_MINUTES:-15}
      SEARCH_ANALYTICS_RAW_RETENTION_DAYS: ${SEARCH_ANALYTICS_RAW_RETENTION_DAYS:-90}
    ports:
      - "127.0.0.1:${APP_BIND_PORT:-3000}:3000"
    volumes:
      - catalog_media_data:/app/storage/catalog-media
      - telegram_backup_transfer:/app/storage/telegram-backup-transfer
      - telegram_bot_api_config:/app/storage/telegram-bot-api-config
    depends_on:
      db:
        condition: service_healthy

  telegram-bot-api:
    image: aiogram/telegram-bot-api@sha256:014ba432afdccd97f41a72a79ba3dc3947c89c7ea5cfdea53621c882e5e06553
    profiles: ["telegram-local"]
    restart: unless-stopped
    env_file:
      - path: .telegram-bot-api.env
        required: false
    environment:
      TELEGRAM_LOCAL: "1"
      TELEGRAM_VERBOSITY: "1"
      TELEGRAM_RUNTIME_CREDENTIALS_FILE: /run/mt-telegram-config/credentials.env
    entrypoint: ["/bin/sh", "/opt/mt/runtime-entrypoint.sh"]
    depends_on:
      app:
        condition: service_started
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    volumes:
      - telegram_bot_api_data:/var/lib/telegram-bot-api
      - telegram_backup_transfer:/var/lib/telegram-bot-api/backup-upload:ro
      - telegram_bot_api_config:/run/mt-telegram-config:ro
      - ./docker/telegram-bot-api/runtime-entrypoint.sh:/opt/mt/runtime-entrypoint.sh:ro
    healthcheck:
      test: ["CMD-SHELL", "nc -z 127.0.0.1 8081"]
      interval: 10s
      timeout: 3s
      retries: 30

  redis:
    image: redis:7.2-alpine
    profiles: ["search"]
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes"]
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    ports:
      - "127.0.0.1:${REDIS_BIND_PORT:-6379}:6379"
    volumes:
      - search_redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 12

  opensearch:
    build:
      context: .
      dockerfile: docker/opensearch/Dockerfile
      args:
        OPENSEARCH_VERSION: ${OPENSEARCH_VERSION:-3.7.0}
    profiles: ["search"]
    restart: unless-stopped
    environment:
      discovery.type: single-node
      plugins.security.disabled: "true"
      DISABLE_INSTALL_DEMO_CONFIG: "true"
      OPENSEARCH_JAVA_OPTS: ${OPENSEARCH_JAVA_OPTS:--Xms512m -Xmx512m}
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    ports:
      - "127.0.0.1:${OPENSEARCH_BIND_PORT:-9200}:9200"
    volumes:
      - search_opensearch_data:/usr/share/opensearch/data
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost:9200/_cluster/health?wait_for_status=yellow >/dev/null"]
      interval: 10s
      timeout: 5s
      retries: 30

volumes:
  banner_db_data:
  catalog_media_data:
  telegram_bot_api_data:
  telegram_backup_transfer:
  telegram_bot_api_config:
  search_redis_data:
  search_opensearch_data:
